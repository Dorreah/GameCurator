[package]
name = "curator-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Game Curator core: database, portable paths, archive scanner, file catalog, artwork and backups. No GUI dependencies."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico", "bmp"] }
webp = { version = "0.3", default-features = false }
# GOG.com game details (the only online feature, started by the user): HTTPS with rustls
# and the Mozilla root certificates built in, so nothing depends on the PC's settings
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"

[dev-dependencies]
tempfile = "3"
