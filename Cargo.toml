[workspace]
members = ["crates/curator-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

# Small, lean release binary (Tauri app-size recommendations).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Image decoding/encoding is painfully slow without optimizations, even in dev.
[profile.dev.package."*"]
opt-level = 2
