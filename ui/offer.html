<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8">
  <title data-i18n-doc="Back from the game - Game Curator">Back from the game - Game Curator</title>
  <link rel="stylesheet" href="css/retro.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/classic.css">
  <link rel="stylesheet" href="css/media.css">
  <script src="js/theme-boot.js"></script>
  <script type="module" src="js/offer.js"></script>
</head>
<body class="media-window">
  <div class="offer window">
    <div class="window-body offer-body">
      <div class="dlg-icon info">&#9998;</div>
      <div class="dlg-text" id="of-text">&nbsp;</div>
      <label class="check offer-never"><input type="checkbox" id="of-never"> <span data-i18n="Don't show this again">Don't show this again</span></label>
    </div>
    <div class="window-foot">
      <span class="left muted" id="of-more"></span>
      <button class="btn" id="of-later" data-i18n="Not now">Not now</button>
      <button class="btn gold" id="of-write">&#9998; <span data-i18n="Write entry">Write entry</span></button>
    </div>
  </div>
</body>
</html>
