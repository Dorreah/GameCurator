<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="utf-8">
  <title>Game Curator</title>
  <link rel="stylesheet" href="css/retro.css">
  <link rel="stylesheet" href="css/themes.css">
  <script src="js/theme-boot.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <div class="main-row">
      <aside class="panel bevel-out sidebar">
        <div class="logo">
          <span class="logo-mark" aria-hidden="true"></span>
          <div>
            <div class="logo-text">Game Curator</div>
            <div class="logo-sub">Personal game archive</div>
          </div>
        </div>
        <!-- Line icons drawn for Game Curator; they use currentColor, so every theme recolours them. -->
        <nav class="nav" id="nav">
          <button data-view="library" id="nav-library" title="Library (Alt+1)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 7.5h10.8a4 4 0 0 1 3.9 3.2l.9 4.4a2.6 2.6 0 0 1-4.4 2.3L15.6 15.5H8.4l-2.2 1.9a2.6 2.6 0 0 1-4.4-2.3l.9-4.4a4 4 0 0 1 3.9-3.2z"/><path d="M7.4 10v3.4M5.7 11.7h3.4"/><circle class="dot" cx="15.6" cy="10.6" r="1"/><circle class="dot" cx="17.8" cy="12.8" r="1"/></svg>
            <span>Library</span>
          </button>
          <button data-view="journal" id="nav-journal" title="Gaming Journal (Alt+2)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h8.5a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H5z"/><path d="M5 3.5v17M3.5 7.5H5M3.5 12H5M3.5 16.5H5M8 8h4M8 11h3"/><path d="M20.6 8.2l-6.9 6.9-2.6.9.9-2.6 6.9-6.9a1.2 1.2 0 0 1 1.7 1.7z"/></svg>
            <span>Gaming Journal</span>
          </button>
          <button data-view="scanner" id="nav-scanner" title="Archive Scanner (Alt+3)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.3"/><path d="M12 12l6.2-5.6"/><circle class="dot" cx="12" cy="12" r="1.2"/><circle class="dot" cx="15.4" cy="15.2" r="1"/></svg>
            <span>Archive Scanner</span>
          </button>
          <button data-view="settings" id="nav-settings" title="Settings (Alt+4)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 5.0 L10.5 2.3 L13.5 2.3 L14.1 5.0 L15.4 5.6 L17.8 4.1 L19.9 6.2 L18.4 8.6 L19.0 9.9 L21.7 10.5 L21.7 13.5 L19.0 14.1 L18.4 15.4 L19.9 17.8 L17.8 19.9 L15.4 18.4 L14.1 19.0 L13.5 21.7 L10.5 21.7 L9.9 19.0 L8.6 18.4 L6.2 19.9 L4.1 17.8 L5.6 15.4 L5.0 14.1 L2.3 13.5 L2.3 10.5 L5.0 9.9 L5.6 8.6 L4.1 6.2 L6.2 4.1 L8.6 5.6Z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>Settings</span>
          </button>
          <div class="nav-spacer"></div>
          <button data-view="about" id="nav-about" title="About (Alt+5)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10.8v6"/><circle class="dot" cx="12" cy="7.6" r="1.1"/></svg>
            <span>About</span>
          </button>
        </nav>
      </aside>
      <main class="panel bevel-out main" id="main"></main>
    </div>

    <footer class="statusbar">
      <div class="sb-archive" id="sb-archive"><span class="led"></span> Opening archive…</div>
      <div id="sb-count">–</div>
      <div class="sb-msg" id="sb-msg">Ready.</div>
      <div id="sb-version">v0.1</div>
    </footer>
  </div>
  <div id="modal-root"></div>
</body>
</html>
